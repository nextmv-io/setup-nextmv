name: smoketest

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run setup-nextmv action
        uses: ./

      - name: Verify Nextmv CLI is available
        run: |
          nextmv version
